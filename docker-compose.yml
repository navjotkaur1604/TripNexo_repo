services:
  mongodb:
    image: mongo:7
    container_name: tripnexo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tripnexo-net

  redis:
    image: redis:7-alpine
    container_name: tripnexo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tripnexo-net

  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: tripnexo-auth-service
    command: ["node", "services/auth/server.js"]
    environment:
      NODE_ENV: production
      AUTH_SERVICE_PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/tripnexo
      JWT_SECRET: ${JWT_SECRET:-tripnexo_docker_secret_change_me}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000
      STORAGE_DRIVER: local
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tripnexo-net

  destination-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: tripnexo-destination-service
    command: ["node", "services/destinations/server.js"]
    environment:
      NODE_ENV: production
      DESTINATION_SERVICE_PORT: 5002
      MONGODB_URI: mongodb://mongodb:27017/tripnexo
      REDIS_URL: redis://redis:6379
      REDIS_TTL_SECONDS: 300
      JWT_SECRET: ${JWT_SECRET:-tripnexo_docker_secret_change_me}
      CLIENT_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tripnexo-net

  trip-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: tripnexo-trip-service
    command: ["node", "services/trips/server.js"]
    environment:
      NODE_ENV: production
      TRIP_SERVICE_PORT: 5003
      MONGODB_URI: mongodb://mongodb:27017/tripnexo
      JWT_SECRET: ${JWT_SECRET:-tripnexo_docker_secret_change_me}
      CLIENT_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tripnexo-net

  budget-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: tripnexo-budget-service
    command: ["node", "services/budget/server.js"]
    environment:
      NODE_ENV: production
      BUDGET_SERVICE_PORT: 5004
      MONGODB_URI: mongodb://mongodb:27017/tripnexo
      JWT_SECRET: ${JWT_SECRET:-tripnexo_docker_secret_change_me}
      CLIENT_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tripnexo-net

  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: tripnexo-api-gateway
    command: ["node", "gateway/server.js"]
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      DESTINATION_SERVICE_URL: http://destination-service:5002
      TRIP_SERVICE_URL: http://trip-service:5003
      BUDGET_SERVICE_URL: http://budget-service:5004
      CLIENT_URL: http://localhost:3000
    depends_on:
      auth-service:
        condition: service_healthy
      destination-service:
        condition: service_healthy
      trip-service:
        condition: service_healthy
      budget-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tripnexo-net

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      args:
        VITE_API_URL: /api
    container_name: tripnexo-client
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - tripnexo-net

volumes:
  mongo_data:
  uploads_data:

networks:
  tripnexo-net:
    driver: bridge
